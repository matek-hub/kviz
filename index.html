    '7.2.3.* Ha <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"> <semantics>  <mrow>   <mi>a</mi>   <mo stretchy="false">∈</mo>   <mi mathvariant="normal">ℝ</mi>  </mrow>  <annotation encoding="StarMath 5.0">a  in setR  </annotation> </semantics></math>, akkor <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"> <semantics>  <mrow>   <mrow>    <msqrt>     <msup>      <mi>a</mi>      <mn>2</mn>     </msup>    </msqrt>    <mo stretchy="false">=</mo>    <mn>?</mn>   </mrow>   </mrow>  <annotation encoding="StarMath 5.0">sqrt{ a^{2} } =?</annotation> </semantics></math><br><br>Számítsd ki:<br><br><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"> <semantics>  <mrow>   <msqrt>    <msup>     <mn>7</mn>     <mn>2</mn>    </msup>   </msqrt>   <mo stretchy="false">=</mo>   <mi>?</mi>  </mrow>  <annotation encoding="StarMath 5.0">sqrt{ 7 ^{2} } =?</annotation> </semantics></math><br><br><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"> <semantics>  <mrow>   <msqrt>    <msup>     <mrow>      <mo fence="true" form="prefix" stretchy="false">(</mo>      <mrow>       <mrow>        <mo stretchy="false">−</mo>        <mn>5</mn>       </mrow>      </mrow>      <mo fence="true" form="postfix" stretchy="false">)</mo>     </mrow>     <mn>2</mn>    </msup>   </msqrt>   <mo stretchy="false">=</mo>   <mi>?</mi>  </mrow>  <annotation encoding="StarMath 5.0">sqrt{ (-5) ^{2} } =?</annotation> </semantics></math>',
    '7.2.4.* Számítsd ki: <br><br><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"> <semantics>  <mrow>   <msqrt>    <mfrac>     <mn>49</mn>     <mn>144</mn>    </mfrac>   </msqrt>   <mo stretchy="false">=</mo>   <mi>?</mi>  </mrow>  <annotation encoding="StarMath 5.0">sqrt{ frac {49} {144}  } =?</annotation> </semantics></math><br><br><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"> <semantics>  <mrow>   <msqrt>    <mn>0,81</mn>   </msqrt>   <mo stretchy="false">=</mo>   <mi>?</mi>  </mrow>  <annotation encoding="StarMath 5.0">sqrt{ 0,81 } =?</annotation> </semantics></math><br><br><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"> <semantics>  <mrow>   <msqrt>    <mrow>     <mn>2</mn>     <mi>,</mi>     <mrow>      <mo fence="true" form="prefix" stretchy="false">(</mo>      <mrow>       <mn>7</mn>      </mrow>      <mo fence="true" form="postfix" stretchy="false">)</mo>     </mrow>    </mrow>   </msqrt>   <mo stretchy="false">=</mo>   <mi>?</mi>  </mrow>  <annotation encoding="StarMath 5.0">sqrt{ 2, (7)  } =?</annotation> </semantics></math>',

    '7.2.7.* Hasonlítsd össze az alábbi számokat:<br><br><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"> <semantics>  <mrow>   <mn>7</mn>   <mi mathvariant="italic">és</mi>   <msqrt>    <mn>50</mn>   </msqrt>  </mrow>  <annotation encoding="StarMath 5.0">7 és sqrt{ 50 } </annotation> </semantics></math><br><br><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"> <semantics>  <mrow>   <mrow>    <mo stretchy="false">−</mo>    <mn>3</mn>   </mrow>   <msqrt>    <mn>2</mn>   </msqrt>   <mrow>    <mi mathvariant="italic">és</mi>    <mo stretchy="false">−</mo>    <mn>2</mn>   </mrow>   <msqrt>    <mn>5</mn>   </msqrt>  </mrow>  <annotation encoding="StarMath 5.0"> -3sqrt{2}  és -2sqrt{ 5 } </annotation> </semantics></math><br><br><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"> <semantics>  <mrow>   <mn>4</mn>   <msqrt>    <mn>3</mn>   </msqrt>   <mi mathvariant="italic">és</mi>   <msqrt>    <mn>48</mn>   </msqrt>  </mrow>  <annotation encoding="StarMath 5.0"> 4sqrt{3}  és sqrt{ 48 } </annotation> </semantics></math>',
    '7.2.8.* Helyezd két egymás után következő egész szám közé:<br><br><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"> <semantics>  <mrow>   <mi>n</mi>   <mo stretchy="false">&lt;</mo>   <msqrt>    <mn>48</mn>   </msqrt>   <mo stretchy="false">&lt;</mo>   <mrow>    <mi>n</mi>    <mo stretchy="false">+</mo>    <mn>1</mn>   </mrow>  </mrow>  <annotation encoding="StarMath 5.0">n  &lt;  sqrt{ 48 }  &lt; n+1 </annotation> </semantics></math><br><br><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"> <semantics>  <mrow>   <mrow>    <mi>n</mi>    <mo stretchy="false">&lt;</mo>    <mn>5</mn>   </mrow>   <mrow>    <msqrt>     <mn>2</mn>    </msqrt>    <mo stretchy="false">&lt;</mo>    <mrow>     <mi>n</mi>     <mo stretchy="false">+</mo>     <mn>1</mn>    </mrow>   </mrow>  </mrow>  <annotation encoding="StarMath 5.0">n  &lt;  5sqrt{ 2 }  &lt; n+1 </annotation> </semantics></math>',
    '7.2.9.* Bontrsd fel a modulusokat:<br><br><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"> <semantics>  <mrow>   <mrow>    <mo fence="true" form="prefix" stretchy="false">|</mo>    <mrow>     <mrow>      <mn>3</mn>      <mo stretchy="false">+</mo>      <msqrt>       <mn>5</mn>      </msqrt>     </mrow>    </mrow>    <mo fence="true" form="postfix" stretchy="false">|</mo>   </mrow>   <mo stretchy="false">=</mo>   <mi>?</mi>  </mrow>  <annotation encoding="StarMath 5.0">lline 3+ sqrt{5}  rline =?</annotation> </semantics></math><br><br><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"> <semantics>  <mrow>   <mrow>    <mo fence="true" form="prefix" stretchy="false">|</mo>    <mrow>     <mrow>      <msqrt>       <mn>3</mn>      </msqrt>      <mo stretchy="false">−</mo>      <mn>2</mn>     </mrow>    </mrow>    <mo fence="true" form="postfix" stretchy="false">|</mo>   </mrow>   <mo stretchy="false">=</mo>   <mi>?</mi>  </mrow>  <annotation encoding="StarMath 5.0">lline sqrt{3} -2  rline =?</annotation> </semantics></math><br><br><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"> <semantics>  <mrow>   <mrow>    <mo fence="true" form="prefix" stretchy="false">|</mo>    <mrow>     <mrow>      <msqrt>       <mn>7</mn>      </msqrt>      <mo stretchy="false">−</mo>      <mn>1</mn>     </mrow>    </mrow>    <mo fence="true" form="postfix" stretchy="false">|</mo>   </mrow>   <mo stretchy="false">=</mo>   <mi>?</mi>  </mrow>  <annotation encoding="StarMath 5.0">lline sqrt{7} -1  rline =?</annotation> </semantics></math>',
    '7.2.10.* Számítsd ki:<br><br><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"> <semantics>  <mrow>   <mn>2</mn>   <mrow>    <msqrt>     <mn>3</mn>    </msqrt>    <mo stretchy="false">+</mo>    <mn>4</mn>   </mrow>   <mrow>    <msqrt>     <mn>3</mn>    </msqrt>    <mo stretchy="false">−</mo>    <mn>9</mn>   </mrow>   <mrow>    <msqrt>     <mn>3</mn>    </msqrt>    <mo stretchy="false">=</mo>    <mi>?</mi>   </mrow>  </mrow>  <annotation encoding="StarMath 5.0">2 sqrt{3} + 4 sqrt{3} - 9 sqrt{3}=?  </annotation> </semantics></math><br><br><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"> <semantics>  <mrow>   <mrow>    <msqrt>     <mn>50</mn>    </msqrt>    <mo stretchy="false">−</mo>    <mn>2</mn>   </mrow>   <mrow>    <msqrt>     <mn>18</mn>    </msqrt>    <mo stretchy="false">=</mo>    <mi>?</mi>   </mrow>  </mrow>  <annotation encoding="StarMath 5.0"> sqrt{50} - 2sqrt{18}=?  </annotation> </semantics></math>',
    '7.2.11.* Számítsd ki:<br><br><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"> <semantics>  <mrow>   <mn>2</mn>   <mrow>    <msqrt>     <mn>3</mn>    </msqrt>    <mo stretchy="false">⋅</mo>    <mn>3</mn>   </mrow>   <mrow>    <msqrt>     <mn>5</mn>    </msqrt>    <mo stretchy="false">=</mo>    <mi>?</mi>   </mrow>  </mrow>  <annotation encoding="StarMath 5.0"> 2sqrt{3} cdot 3sqrt{5}=?  </annotation> </semantics></math><br><br><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"> <semantics>  <mrow>   <mn>3</mn>   <mrow>    <mrow>     <msqrt>      <mn>2</mn>     </msqrt>     <mo stretchy="false">⋅</mo>     <mrow>      <mo fence="true" form="prefix" stretchy="false">(</mo>      <mrow>       <mrow>        <mrow>         <mn>5</mn>         <mo stretchy="false">−</mo>         <mn>2</mn>        </mrow>        <msqrt>         <mn>2</mn>        </msqrt>       </mrow>      </mrow>      <mo fence="true" form="postfix" stretchy="false">)</mo>     </mrow>    </mrow>    <mo stretchy="false">=</mo>    <mi>?</mi>   </mrow>  </mrow>  <annotation encoding="StarMath 5.0"> 3sqrt{2} cdot (5-2 sqrt{2} ) =?  </annotation> </semantics></math>',
    '7.2.12.* Számítsd ki:<br><br><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"> <semantics>  <mrow>   <mn>8</mn>   <msqrt>    <mn>12</mn>   </msqrt>   <mi mathvariant="normal">:</mi>   <mn>2</mn>   <mrow>    <msqrt>     <mn>3</mn>    </msqrt>    <mo stretchy="false">=</mo>    <mi>?</mi>   </mrow>  </mrow>  <annotation encoding="StarMath 5.0"> 8sqrt{12} : 2sqrt{3} =?  </annotation> </semantics></math><br><br><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"> <semantics>  <mrow>   <mrow>    <mo fence="true" form="prefix" stretchy="false">(</mo>    <mrow>     <mrow>      <mn>8</mn>      <mrow>       <msqrt>        <mn>12</mn>       </msqrt>       <mo stretchy="false">+</mo>       <mn>6</mn>      </mrow>      <msqrt>       <mn>6</mn>      </msqrt>     </mrow>    </mrow>    <mo fence="true" form="postfix" stretchy="false">)</mo>   </mrow>   <mi mathvariant="normal">:</mi>   <mn>2</mn>   <mrow>    <msqrt>     <mn>3</mn>    </msqrt>    <mo stretchy="false">=</mo>    <mi>?</mi>   </mrow>  </mrow>  <annotation encoding="StarMath 5.0"> (8sqrt{12}+6 sqrt{6} )  : 2sqrt{3} =?  </annotation> </semantics></math>',
    '7.2.13.* Számítsd ki:<br><br><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"> <semantics>  <mrow>   <msup>    <mrow>     <mo fence="true" form="prefix" stretchy="false">(</mo>     <mrow>      <mrow>       <mrow>        <mo stretchy="false">−</mo>        <mn>3</mn>       </mrow>       <msqrt>        <mn>5</mn>       </msqrt>      </mrow>     </mrow>     <mo fence="true" form="postfix" stretchy="false">)</mo>    </mrow>    <mn>2</mn>   </msup>   <mo stretchy="false">=</mo>   <mi>?</mi>  </mrow>  <annotation encoding="StarMath 5.0"> ( -3{ sqrt{5} } ) ^{2} =?</annotation> </semantics></math><br><br><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"> <semantics>  <mrow>   <msup>    <mrow>     <mo fence="true" form="prefix" stretchy="false">(</mo>     <mrow>      <mrow>       <mn>2</mn>       <msqrt>        <mn>2</mn>       </msqrt>      </mrow>     </mrow>     <mo fence="true" form="postfix" stretchy="false">)</mo>    </mrow>    <mn>3</mn>   </msup>   <mo stretchy="false">=</mo>   <mi>?</mi>  </mrow>  <annotation encoding="StarMath 5.0"> ( 2{ sqrt{2} } ) ^{3} =?</annotation> </semantics></math>',

    '7.2.16.* Old meg az alábbi egyenleteket:<br><br><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"> <semantics>  <mrow>   <msup>    <mi>x</mi>    <mn>2</mn>   </msup>   <mo stretchy="false">=</mo>   <mn>36</mn>  </mrow>  <annotation encoding="StarMath 5.0">x^{2} =36</annotation> </semantics></math><br><br><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"> <semantics>  <mrow>   <msup>    <mi>x</mi>    <mn>2</mn>   </msup>   <mo stretchy="false">=</mo>   <mrow>    <mo stretchy="false">−</mo>    <mn>4</mn>   </mrow>  </mrow>  <annotation encoding="StarMath 5.0">x^{2} =-4</annotation> </semantics></math>',

let timeoutId;
function keretPirosra30mpUtan() {
  timeoutId = setTimeout(function () {
    const div = document.getElementById("nextBtn");
    if (div) {
      div.style.border = "3px solid red";
      div.style.borderRadius ="6px";
    }
  }, 25000); // 30 000 ms = 30 másodperc
}
// Tömb keverése (Fisher-Yates)
function shuffle(array) {
    for (let i=array.length-1; i>0; i--) {
        const j = Math.floor(Math.random()*(i+1));
        [array[i], array[j]] = [array[j], array[i]];
    }
}

const kodDiv = document.getElementById('kod');
const nextBtn = document.getElementById('nextBtn');
const counterDiv = document.getElementById('counter');

function bontCsillagAlapjan(szoveg) {
  const reszek = szoveg.split("*");
  return {
    kod: reszek[0] || "",
    feladat: reszek[1] || ""
  };
}
counter=1;

    document.getElementById("nextBtn").style.border = "2px solid gray";

    clearTimeout(timeoutId);

        if (currentIndex < questions.length) {
            const eredmeny = bontCsillagAlapjan( questions[currentIndex++]);

                        questionDiv.innerHTML =eredmeny.feladat;
                        kodDiv.innerHTML =eredmeny.kod; 
                }
            } 
            else {
        questionDiv.innerHTML = "Nincs több kérdés!";
        nextBtn.disabled = true;

}

nextBtn.addEventListener('click', showNextQuestion);

<div id="clock"></div>

<script>
  function updateClock() {
    const now = new Date();

    const hours = String(now.getHours()).padStart(2, "0");
    const minutes = String(now.getMinutes()).padStart(2, "0");
    const seconds = String(now.getSeconds()).padStart(2, "0");

    document.getElementById("clock").textContent =
      hours + ":" + minutes + ":" + seconds;
  }

  updateClock(); // azonnali kiírás
  setInterval(updateClock, 1000); // frissítés 1 mp-enként
</script>
